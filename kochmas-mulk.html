<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Ko'chmas mulk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auga.css">
<style>
/* ---- Ko'chmas mulk (ekran 14) ---- */
.km-grid{display:grid;grid-template-columns:1fr 372px;gap:18px;align-items:start}
.km-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.km-kpi .karta{display:flex;align-items:center;gap:14px;padding:18px 20px}
.km-kpi .tile{width:52px;height:52px;border-radius:99px;background:#EAF6D3;color:#4F8F08;display:grid;place-items:center;flex:none}
.km-kpi .tile .ic{width:24px;height:24px}
.km-kpi .yorliq{font-size:13.5px;color:var(--matn-3)}
.km-kpi b{font-size:26px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.km-kpi b small{font-size:15px;font-weight:600;color:var(--matn-3)}
.km-kpi .osish{display:block;font-size:12.5px;color:#3E9412;font-weight:650;margin-top:2px}

.filtr-qator{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.filtr-qator .tanlov{width:auto;min-width:165px;background:var(--karta);border:none;box-shadow:var(--soya)}
.f-tugma{display:flex;align-items:center;gap:9px;height:48px;padding:0 18px;background:var(--karta);border-radius:14px;box-shadow:var(--soya);font-size:14.5px;font-weight:650;color:#23272C}
.f-tugma .ic{width:18px;height:18px;color:#43484E}
.korinish{margin-left:auto;display:flex;gap:4px;background:var(--karta);border-radius:12px;box-shadow:var(--soya);padding:4px}
.korinish button{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#5F6169;transition:all var(--tez)}
.korinish button.aktiv{background:#EAF6D3;color:#3E7C0A}
.korinish .ic{width:18px;height:18px}

.mulk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mulk-karta{background:var(--karta);border-radius:18px;box-shadow:var(--soya);overflow:hidden;text-align:left;transition:transform var(--tez),box-shadow var(--tez);display:flex;flex-direction:column}
.mulk-karta:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(23,26,31,.05),0 14px 34px rgba(23,26,31,.10)}
.mulk-karta img{width:100%;height:190px;object-fit:cover;background:#FAFAF8}
.mulk-tana{padding:16px 18px 18px}
.mulk-bosh{display:flex;align-items:center;gap:10px}
.mulk-bosh b{font-size:16px;font-weight:750;flex:1}
.mulk-holat{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#5B6168;white-space:nowrap}
.mulk-holat .nuqta{width:7px;height:7px;border-radius:99px}
.mulk-tur{font-size:13px;color:var(--matn-3);margin-top:3px}
.mulk-manzil{font-size:12.5px;color:var(--matn-4);margin-top:1px}
.mulk-past{display:flex;align-items:flex-end;margin-top:14px;padding-top:13px;border-top:1px solid var(--chiziq)}
.mulk-past .yorliq{font-size:12px;color:var(--matn-4)}
.mulk-past .qiymat{font-size:14.5px;font-weight:750;margin-top:2px}
.bandlik{margin-left:auto;display:flex;align-items:center;gap:9px;text-align:right}
.bandlik .foiz{font-size:14.5px;font-weight:750}
.bandlik .halqa{position:relative;width:44px;height:44px;display:grid;place-items:center}
.bandlik .halqa b{position:absolute;font-size:11px;font-weight:750;color:#3E7C0A}

/* O'ng panel */
.portfel h3{font-size:17px;font-weight:750;margin-bottom:14px}
.portfel-donut{position:relative;width:220px;height:220px;margin:0 auto}
.portfel-markaz{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.portfel-markaz .yorliq{font-size:12.5px;color:var(--matn-3)}
.portfel-markaz b{display:block;font-size:24px;font-weight:750;letter-spacing:-.01em}
.portfel-markaz small{font-size:13px;color:var(--matn-3);font-weight:600}
.portfel .legend{margin-top:18px}
.hududlar-karta h3{font-size:17px;font-weight:750;margin-bottom:6px}
.hudud-prog{padding:11px 0;border-bottom:1px solid #F2F3F5}
.hudud-prog:last-of-type{border-bottom:none}
.hudud-prog .qator{display:flex;font-size:13.5px}
.hudud-prog .nomi{font-weight:650;color:#23272C}
.hudud-prog .summa{margin-left:auto;color:var(--matn-3)}
.hudud-prog .foiz{width:52px;text-align:right;font-weight:700;color:#17191C}
.hudud-prog .iz{height:6px;border-radius:99px;background:#EDEFE9;margin-top:8px;overflow:hidden}
.hudud-prog .tolgan{display:block;height:100%;border-radius:99px;background:#78C802}
.toliq-tugma{
  width:100%;height:50px;margin-top:14px;border-radius:13px;border:1px solid var(--kirish-chiziq);
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:700;color:#23272C;
  transition:background var(--tez);
}
.toliq-tugma:hover{background:#F6F7F8}
.toliq-tugma .ic{width:18px;height:18px}
@media (max-width:1560px){.mulk-grid{grid-template-columns:1fr 1fr}}
@media (max-width:1400px){.km-kpi{grid-template-columns:1fr 1fr}}
@media (max-width:1240px){.km-grid{grid-template-columns:1fr}}
@media (max-width:900px){.mulk-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-sahifa="mulk">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="sahifa-qator">
      <div>
        <h1>Ko'chmas mulk</h1>
        <div class="sahifa-izoh">Barcha ko'chmas mulk obyektlari va portfel ko'rsatkichlari</div>
      </div>
    </div>

    <!-- KPI -->
    <section class="km-kpi" aria-label="Portfel ko'rsatkichlari">
      <button class="karta" data-toast="Obyektlar ro'yxati">
        <span class="tile"><svg class="ic"><use href="#i-bino"/></svg></span>
        <span><span class="yorliq">Jami obyektlar</span><b>6 <small>Ta</small></b><span class="osish">+2 &nbsp;Bu oy</span></span>
      </button>
      <button class="karta" data-toast="Qiymat dinamikasi">
        <span class="tile"><svg class="ic"><use href="#i-aktiv"/></svg></span>
        <span><span class="yorliq">Jami qiymat</span><b>125,8 <small>mlrd so'm</small></b><span class="osish">+ 8,6 mlrd so'm</span></span>
      </button>
      <button class="karta" data-toast="Bandlik tahlili">
        <span class="tile"><svg class="ic"><use href="#i-soat"/></svg></span>
        <span><span class="yorliq">O'rtacha bandlik</span><b>78%</b><span class="osish">+ 6%</span></span>
      </button>
      <button class="karta" data-toast="Daromad tahlili">
        <span class="tile"><svg class="ic"><use href="#i-daromad"/></svg></span>
        <span><span class="yorliq">Yillik daromad</span><b>12,6 <small>mlrd so'm</small></b><span class="osish">+ 1,2 mlrd so'm</span></span>
      </button>
    </section>

    <div class="filtr-qator">
      <button class="tanlov" id="mf-tur" data-variantlar='["Barcha turdagi","Turar-joy","Ofis","Savdo","Dacha","Yer uchastkasi"]'><span class="t-yorliq">Barcha turdagi</span><svg class="ic"><use href="#i-past"/></svg></button>
      <button class="tanlov" id="mf-hudud" data-variantlar='["Barcha hudud","Toshkent sh.","Toshkent vil.","Boshqa hududlar"]'><span class="t-yorliq">Barcha hudud</span><svg class="ic"><use href="#i-past"/></svg></button>
      <button class="tanlov" id="mf-status" data-variantlar='["Barcha status","Faol","Rejalashtirilgan","Ta&#39;mirda"]'><span class="t-yorliq">Barcha status</span><svg class="ic"><use href="#i-past"/></svg></button>
      <button class="f-tugma" data-toast="Kengaytirilgan filtrlar"><svg class="ic"><use href="#i-slayder"/></svg>Filtrlar</button>
      <div class="korinish" role="group" aria-label="Ko'rinish">
        <button class="aktiv" id="k-grid" aria-label="Kartalar ko'rinishi"><svg class="ic"><use href="#i-panel"/></svg></button>
        <button id="k-royxat" aria-label="Ro'yxat ko'rinishi"><svg class="ic"><use href="#i-topshiriq"/></svg></button>
      </div>
    </div>

    <div class="km-grid">
      <div>
        <div class="mulk-grid" id="mulk-grid"></div>
        <div class="sahifalash" style="background:var(--karta);border-radius:16px;box-shadow:var(--soya);margin-top:16px">
          <span class="oraliq">Jami: <b>6</b></span>
          <button class="s-tugma" disabled aria-label="Oldingi"><svg class="ic" style="width:16px;height:16px"><use href="#i-chap"/></svg></button>
          <button class="s-tugma aktiv">1</button>
          <button class="s-tugma" disabled aria-label="Keyingi"><svg class="ic" style="width:16px;height:16px"><use href="#i-ong"/></svg></button>
        </div>
      </div>

      <aside style="display:flex;flex-direction:column;gap:18px">
        <div class="karta portfel">
          <h3>Portfel tarkibi</h3>
          <div class="portfel-donut">
            <svg width="220" height="220" viewBox="0 0 220 220" id="portfel-donut" role="img"
                 aria-label="Portfel tarkibi: Ofis 34,5%, Turar-joy 22,6%, Savdo 20,4%, Biznes markazi 15%, Yer 7,5%"></svg>
            <div class="portfel-markaz"><span><span class="yorliq">Jami qiymat</span><b>125,8</b><small>mlrd so'm</small></span></div>
          </div>
          <div class="legend">
            <button class="legend-qator" data-toast="Turar-joy obyektlari"><span class="nuqta" style="background:#5A9CF8"></span><span class="nomi">Turar-joy</span><b>28,450 mlrd · 22,6%</b></button>
            <button class="legend-qator" data-toast="Ofis obyektlari"><span class="nuqta" style="background:#63C551"></span><span class="nomi">Ofis</span><b>43,400 mlrd · 34,5%</b></button>
            <button class="legend-qator" data-toast="Savdo obyektlari"><span class="nuqta" style="background:#F2C230"></span><span class="nomi">Savdo</span><b>25,600 mlrd · 20,4%</b></button>
            <button class="legend-qator" data-toast="Biznes markazlari"><span class="nuqta" style="background:#8CD121"></span><span class="nomi">Biznes markazi</span><b>18,900 mlrd · 15,0%</b></button>
            <button class="legend-qator" data-toast="Yer uchastkalari"><span class="nuqta" style="background:#C7C7CD"></span><span class="nomi">Yer uchastkasi</span><b>9,450 mlrd · 7,5%</b></button>
          </div>
        </div>

        <div class="karta hududlar-karta">
          <h3>Hududlar bo'yicha</h3>
          <div class="hudud-prog">
            <div class="qator"><span class="nomi">Toshkent shahri</span><span class="summa">95,3 mlrd so'm</span><span class="foiz">75,8%</span></div>
            <div class="iz"><span class="tolgan" style="width:75.8%"></span></div>
          </div>
          <div class="hudud-prog">
            <div class="qator"><span class="nomi">Toshkent viloyati</span><span class="summa">22,5 mlrd so'm</span><span class="foiz">17,9%</span></div>
            <div class="iz"><span class="tolgan" style="width:17.9%"></span></div>
          </div>
          <div class="hudud-prog">
            <div class="qator"><span class="nomi">Boshqa hududlar</span><span class="summa">8,0 mlrd so'm</span><span class="foiz">6,3%</span></div>
            <div class="iz"><span class="tolgan" style="width:6.3%"></span></div>
          </div>
          <button class="toliq-tugma" data-toast="Hududlar bo'yicha to'liq hisobot">
            <svg class="ic"><use href="#i-hujjat"/></svg>To'liq hisobot
          </button>
        </div>
      </aside>
    </div>
  </main>
</div>
</div>

<script src="auga.js"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{

const MULKLAR = [
  {nom:"South Residence", tur:"Turar-joy majmuasi", manzil:"Toshkent sh., Yakkasaroy tum.", holat:"Faol", hrang:"#22B14C",
   qiymat:"28 450 000 000 so'm", bandlik:93, ball:93, rasm:"assets/bino_turar.png", id:"nurafshon-turar"},
  {nom:"Green Tower", tur:"Ofis binosi", manzil:"Toshkent sh., Shayxontohur tum.", holat:"Faol", hrang:"#22B14C",
   qiymat:"24 500 000 000 so'm", bandlik:81, ball:81, rasm:"assets/bino_tower.png", id:"green-tower"},
  {nom:"Chorvoq dacha", tur:"Dacha uyi", manzil:"Toshkent vil., Bo'stonliq tum.", holat:"Faol", hrang:"#22B14C",
   qiymat:"1 850 000 000 so'm", bandlik:70, ball:70, rasm:"assets/bino_dacha.png", id:"chorvoq-dacha"},
  {nom:"Mega Mall", tur:"Savdo markazi", manzil:"Toshkent sh., Mirobod tum.", holat:"Faol", hrang:"#22B14C",
   qiymat:"25 600 000 000 so'm", bandlik:89, ball:89, rasm:"assets/bino_mall.png", id:"mega-mall"},
  {nom:"Business Center", tur:"Biznes markazi", manzil:"Toshkent sh., Chilonzor tum.", holat:"Rejalashtirilgan", hrang:"#4A90F2",
   qiymat:"18 900 000 000 so'm", bandlik:74, ball:74, rasm:"assets/bino_9.png", id:"humo-office"},
  {nom:"Yashnobod yer maydoni", tur:"Yer uchastkasi", manzil:"Toshkent sh., Yashnobod tum.", holat:"Faol", hrang:"#22B14C",
   qiymat:"3 200 000 000 so'm", bandlik:0, ball:0, rasm:"assets/bino_yer.png", id:"yashnobod-yer"}
];

function halqa(b){
  const r=18, C=2*Math.PI*r;
  const rang = b>0 ? "#78C802" : "#D6D9D2";
  return `<svg width="44" height="44" viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="#EAF3D4" stroke-width="4"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${rang}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${(Math.max(b,1.5)/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 22 22)"/>
  </svg>`;
}
let mTur = "Barcha turdagi", mHudud = "Barcha hudud", mStatus = "Barcha status", korinish = "grid";
function mulkFiltrlangan(){
  return MULKLAR.filter(m=>
    (mTur==="Barcha turdagi" || m.tur.includes(mTur)) &&
    (mHudud==="Barcha hudud" || (mHudud==="Boshqa hududlar" ? !m.manzil.startsWith("Toshkent sh.") && !m.manzil.startsWith("Toshkent vil.") : m.manzil.startsWith(mHudud))) &&
    (mStatus==="Barcha status" || m.holat===mStatus)
  );
}
function mulkChiz(){
  const royxat = mulkFiltrlangan();
  const grid = document.getElementById("mulk-grid");
  if (korinish==="grid"){
    grid.className = "mulk-grid";
    grid.innerHTML = royxat.length ? royxat.map(m=>`
      <a class="mulk-karta" href="aktiv.html?id=${m.id}">
        <img src="${m.rasm}" alt="${m.nom}">
        <span class="mulk-tana">
          <span class="mulk-bosh"><b>${m.nom}</b><span class="mulk-holat"><span class="nuqta" style="background:${m.hrang}"></span>${m.holat}</span></span>
          <span class="mulk-tur">${m.tur}</span>
          <span class="mulk-manzil">${m.manzil}</span>
          <span class="mulk-past">
            <span><span class="yorliq">Qiymat</span><br><span class="qiymat">${m.qiymat}</span></span>
            <span class="bandlik">
              <span><span class="yorliq">Bandlik</span><br><span class="foiz">${m.bandlik}%</span></span>
              <span class="halqa">${halqa(m.ball)}<b>${m.ball>0?m.ball+"%":"·"}</b></span>
            </span>
          </span>
        </span>
      </a>`).join("") : `<div style="padding:40px;text-align:center;color:var(--matn-4)">Filtrga mos obyekt topilmadi</div>`;
  } else {
    grid.className = "";
    grid.innerHTML = `<div class="karta jadval-korpus"><div class="jadval-orash"><table class="jadval">
      <thead><tr><th>Obyekt</th><th>Turi</th><th>Manzil</th><th>Qiymat</th><th>Bandlik</th><th>Holat</th></tr></thead>
      <tbody>${royxat.length ? royxat.map(m=>`
        <tr onclick="location.href='aktiv.html?id=${m.id}'">
          <td><b>${m.nom}</b></td><td>${m.tur}</td><td>${m.manzil}</td><td>${m.qiymat}</td><td>${m.bandlik}%</td>
          <td><span class="mini-holat"><span class="nuqta" style="background:${m.hrang}"></span>${m.holat}</span></td>
        </tr>`).join("") : `<tr><td colspan="6" style="text-align:center;color:var(--matn-4);padding:24px">Filtrga mos obyekt topilmadi</td></tr>`}</tbody>
    </table></div></div>`;
  }
}
mulkChiz();

/* Portfel donut */
(function(){
  const s = document.getElementById("portfel-donut");
  const NS = "http://www.w3.org/2000/svg";
  const cx=110, cy=110, r=86, w=30, C=2*Math.PI*r, gap=2.2;
  const data = [[34.5,"#63C551"],[22.6,"#5A9CF8"],[20.4,"#F2C230"],[15.0,"#8CD121"],[7.5,"#C7C7CD"]];
  let boshi=-90;
  data.forEach(([f,rang])=>{
    const yoy = f/100*360-gap;
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);
    c.setAttribute("fill","none");c.setAttribute("stroke",rang);c.setAttribute("stroke-width",w);
    c.setAttribute("stroke-dasharray",(Math.max(yoy,1.4)/360*C)+" "+C);
    c.setAttribute("transform","rotate("+(boshi+gap/2)+" "+cx+" "+cy+")");
    s.appendChild(c);
    boshi += f/100*360;
  });
})();

/* Ko'rinish tugmalari */
document.getElementById("k-grid").addEventListener("click", function(){
  this.classList.add("aktiv"); document.getElementById("k-royxat").classList.remove("aktiv");
  korinish = "grid"; mulkChiz();
});
document.getElementById("k-royxat").addEventListener("click", function(){
  this.classList.add("aktiv"); document.getElementById("k-grid").classList.remove("aktiv");
  korinish = "royxat"; mulkChiz();
});

/* Filtrlar */
document.getElementById("mf-tur").addEventListener("tanlov", e=>{ mTur = e.detail; mulkChiz(); });
document.getElementById("mf-hudud").addEventListener("tanlov", e=>{ mHudud = e.detail; mulkChiz(); });
document.getElementById("mf-status").addEventListener("tanlov", e=>{ mStatus = e.detail; mulkChiz(); });
});
</script>
</body>
</html>
