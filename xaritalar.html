<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Hududlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auga.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* ---- Xarita va hududlar (ekran 5) ---- */
.xarita-maydon{position:relative;min-height:calc(100vh - 130px)}
#leaflet-uzb{
  position:absolute;inset:0;width:100%;height:72%;z-index:1;
}
.ustki-qator{position:relative;z-index:4;display:flex;align-items:flex-start}
.ustki-qator .tanlov{width:auto;min-width:210px;background:var(--karta);border:none;box-shadow:var(--soya);height:52px;border-radius:14px;font-weight:600;color:#23272C}
.rejim{margin-left:auto;display:flex;gap:6px;background:var(--karta);border-radius:13px;padding:5px;box-shadow:var(--soya)}
@media (max-width:480px){.ustki-qator{flex-wrap:wrap}.rejim{margin-left:0}}
.rejim button{height:40px;min-width:52px;border-radius:9px;font-size:14px;font-weight:700;color:#5B6168;transition:all var(--tez)}
.rejim button.aktiv{border:1.5px solid var(--yashil);color:#17191C;background:#FDFFF5}

.legenda{
  position:absolute;z-index:4;right:390px;top:120px;
  background:var(--karta);border-radius:16px;box-shadow:var(--soya);padding:18px 20px;min-width:190px;
}
.legenda h4{font-size:15px;font-weight:750;margin-bottom:12px}
.legenda-qator{display:flex;align-items:center;gap:10px;font-size:14px;color:#3F454C;padding:5px 0}
.legenda-qator .nuqta{width:10px;height:10px;border-radius:99px}

.hudud-panel{
  position:absolute;z-index:4;right:0;top:0;bottom:0;width:370px;
  background:var(--karta);border-radius:18px;box-shadow:var(--soya);
  padding:22px;overflow-y:auto;
}
.hudud-panel h3{font-size:17px;font-weight:750;margin-bottom:8px}
.hudud-band{display:flex;align-items:center;gap:11px;width:100%;padding:9px 8px;margin:0 -8px;border-radius:10px;font-size:14.5px;transition:background var(--tez);text-align:left}
.hudud-band:hover{background:#F6F7F8}
.hudud-band.faol{background:#F3FBE2;box-shadow:inset 0 0 0 1px #CBE99B}
.hudud-band .ic{width:18px;height:18px;color:var(--matn-3)}
.hudud-band .nomi{color:#33383E;font-weight:550}
.hudud-band b{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums;color:#17191C}
.hudud-band .delta{width:56px;text-align:right;font-size:13px}
.hudud-jami{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:16px;border-top:1px solid var(--chiziq)}
.hudud-jami span{font-size:15.5px;font-weight:750}
.hudud-jami b{margin-left:auto;font-size:17px;font-weight:800}
.hudud-jami .delta{font-size:13.5px}

.hudud-kartalar{
  position:absolute;z-index:4;left:0;right:390px;bottom:12px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
}
.hudud-kartalar .h-karta{background:var(--karta);border-radius:16px;box-shadow:var(--soya);padding:18px;text-align:left;transition:transform var(--tez)}
.hudud-kartalar .h-karta:hover{transform:translateY(-2px)}
.h-karta .bosh{display:flex;align-items:center;gap:12px}
.h-karta .tile{width:46px;height:46px;border-radius:13px;background:#EAF6D3;display:grid;place-items:center;color:#4F8F08;flex:none;box-shadow:var(--chuqur-tile)}
.h-karta .tile .ic{width:22px;height:22px}
.h-karta .nomi{font-size:14.5px;font-weight:650;color:#23272C}
.h-karta .qiymat{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.h-karta .qiymat b{font-size:24px;font-weight:750;letter-spacing:-.01em}
.h-karta .izoh{font-size:12.5px;color:var(--matn-4);margin-top:2px}
.h-karta svg.chizma{width:100%;height:38px;margin-top:10px}

@media (max-width:1500px){
  .hudud-kartalar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legenda{right:390px;top:90px}
}
@media (max-width:1240px){
  .xarita-maydon{min-height:auto;display:flex;flex-direction:column;gap:16px}
  #leaflet-uzb{position:relative;height:420px}
  .legenda,.hudud-panel,.hudud-kartalar{position:static;width:100%;max-width:none;right:auto}
  .hudud-kartalar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){.hudud-band{flex-wrap:wrap}.hudud-band b,.hudud-band .delta{margin-left:0}}
@media (max-width:480px){.h-karta .bosh{flex-wrap:wrap}.h-karta .bosh > span{min-width:0}.h-karta .qiymat{flex-wrap:wrap}}
</style>
</head>
<body data-sahifa="xaritalar" data-topbar-sarlavha="Hududlar" data-topbar-ikon="i-xarita">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="xarita-maydon">
      <div id="leaflet-uzb" role="img" aria-label="O'zbekiston hududlari bo'yicha aktivlar faollik xaritasi"></div>

      <div class="ustki-qator">
        <button class="tanlov" id="hudud-filtr" data-variantlar='["Barcha hududlar","Toshkent shahri","Toshkent viloyati","Samarqand","Farg&#39;ona","Buxoro","Qashqadaryo","Navoiy","Andijon","Namangan","Xorazm","Jizzax","Surxondaryo","Qoraqalpog&#39;iston R."]'>
          <span class="t-yorliq">Barcha hududlar</span><svg class="ic"><use href="#i-past"/></svg>
        </button>
        <div class="rejim" role="group" aria-label="Xarita rejimi">
          <button id="r-2d" class="aktiv">Xarita</button>
          <button id="r-3d">Sputnik</button>
        </div>
      </div>

      <div class="legenda">
        <h4>Faollik darajasi</h4>
        <div class="legenda-qator"><span class="nuqta" style="background:#A5D46A"></span>Yuqori</div>
        <div class="legenda-qator"><span class="nuqta" style="background:#F2D664"></span>O'rtacha</div>
        <div class="legenda-qator"><span class="nuqta" style="background:#F0A868"></span>Past</div>
        <div class="legenda-qator"><span class="nuqta" style="background:#C7C7CD"></span>Faol emas</div>
      </div>

      <aside class="hudud-panel">
        <h3>Hududlar bo'yicha jami</h3>
        <div id="hudud-royxat"></div>
        <div class="hudud-jami"><span>Jami aktivlar</span><b>7 161</b><span class="delta">↑ 5,4%</span></div>
      </aside>

      <div class="hudud-kartalar" id="hudud-kartalar"></div>
    </div>
  </main>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="auga.js"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{

const HUDUDLAR = [
  ["Toshkent shahri","1 248","↑ 8,2%",1],["Toshkent viloyati","1 082","↑ 6,4%",1],
  ["Samarqand viloyati","896","↑ 7,1%",1],["Farg'ona viloyati","754","↓ 2,3%",0],
  ["Buxoro viloyati","612","↑ 4,8%",1],["Qashqadaryo viloyati","498","↑ 3,2%",1],
  ["Navoiy viloyati","410","↑ 6,0%",1],["Andijon viloyati","378","↑ 1,7%",1],
  ["Namangan viloyati","339","↑ 2,4%",1],["Xorazm viloyati","287","↑ 5,6%",1],
  ["Jizzax viloyati","253","↑ 3,9%",1],["Surxondaryo viloyati","215","↑ 4,1%",1],
  ["Qoraqalpog'iston R.","189","↑ 2,8%",1]
];
document.getElementById("hudud-royxat").innerHTML = HUDUDLAR.map(h=>`
  <button class="hudud-band">
    <svg class="ic"><use href="#i-bino"/></svg>
    <span class="nomi">${h[0]}</span>
    <b>${h[1]}</b>
    <span class="delta ${h[3]?"":"salbiy"}">${h[2]}</span>
  </button>`).join("");
/* Ro'yxat qatorlari — belgi va hudud filtri bilan bir xil harakat: xaritani uchirish + ajratish */
document.querySelectorAll(".hudud-band").forEach(band=>{
  band.addEventListener("click", ()=>{
    const nom = band.querySelector(".nomi").textContent;
    const geo = HUDUD_GEO[nom];
    document.querySelectorAll(".hudud-band").forEach(b=>b.classList.remove("faol"));
    band.classList.add("faol");
    if (geo && xaritaBor) uzMap.flyTo([geo.lat, geo.lng], 9, {duration:0.6});
    AUGA.toast(`${nom} bo'yicha batafsil`, "i-bino");
  });
});

const KARTALAR = [
  ["Toshkent shahri","1 248","↑ 8,2%","i-bino"],
  ["Samarqand viloyati","896","↑ 7,1%","i-hisobot"],
  ["Buxoro viloyati","612","↑ 4,8%","i-aktiv"],
  ["Qashqadaryo viloyati","498","↑ 3,2%","i-uy"]
];
function chizma(){
  const n = 24, p = [];
  let y = 22;
  for (let i=0;i<n;i++){
    y += (Math.sin(i*1.7)*5) + (i%3===0? -3 : 2.2);
    y = Math.max(8, Math.min(32, y));
    p.push(`${(i/(n-1)*100).toFixed(1)},${y.toFixed(1)}`);
  }
  return `<svg class="chizma" viewBox="0 0 100 38" preserveAspectRatio="none">
    <polyline points="${p.join(" ")}" fill="none" stroke="#78C802" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" filter="url(#depth-sm)"/>
  </svg>`;
}
document.getElementById("hudud-kartalar").innerHTML = KARTALAR.map(k=>`
  <a class="h-karta" href="aktivlar.html">
    <span class="bosh">
      <span class="tile"><svg class="ic"><use href="#${k[3]}"/></svg></span>
      <span>
        <span class="nomi">${k[0]}</span>
        <span class="qiymat"><b>${k[1]}</b><span class="delta">${k[2]}</span></span>
        <span class="izoh">Faol aktivlar soni</span>
      </span>
    </span>
    ${chizma()}
  </a>`).join("");

/* Xarita — Leaflet + OpenStreetMap: viloyat markazlari haqiqiy koordinatalarda,
   doira o'lchami aktivlar soniga (proporsional belgi), rangi faollik darajasiga bog'liq */
const HUDUD_GEO = {
  "Toshkent shahri":      {lat:41.2995, lng:69.2401, daraja:"yuqori"},
  "Toshkent viloyati":    {lat:41.0378, lng:69.3567, daraja:"yuqori"},
  "Samarqand viloyati":   {lat:39.6270, lng:66.9750, daraja:"yuqori"},
  "Farg'ona viloyati":    {lat:40.3864, lng:71.7864, daraja:"nofaol"},
  "Buxoro viloyati":      {lat:39.7747, lng:64.4286, daraja:"yuqori"},
  "Qashqadaryo viloyati": {lat:38.8606, lng:65.7891, daraja:"ortacha"},
  "Navoiy viloyati":      {lat:40.0844, lng:65.3792, daraja:"ortacha"},
  "Andijon viloyati":     {lat:40.7821, lng:72.3442, daraja:"ortacha"},
  "Namangan viloyati":    {lat:40.9983, lng:71.6726, daraja:"ortacha"},
  "Xorazm viloyati":      {lat:41.3775, lng:60.3617, daraja:"past"},
  "Jizzax viloyati":      {lat:40.1158, lng:67.8422, daraja:"past"},
  "Surxondaryo viloyati": {lat:37.9401, lng:67.5714, daraja:"past"},
  "Qoraqalpog'iston R.":  {lat:42.4531, lng:59.6103, daraja:"past"}
};
const DARAJA_RANG = {yuqori:"#A5D46A", ortacha:"#F2D664", past:"#F0A868", nofaol:"#C7C7CD"};

/* Leaflet CDN'dan keladi — tarmoqsiz L aniqlanmaydi va himoyasiz L.map() shu skriptning
   QOLGAN QISMINI to'xtatardi (hudud ro'yxati, filtr, 2D/3D almashtirgich). Endi xarita
   bo'lmasa ham sahifaning boshqa hamma narsasi ishlaydi. */
const xaritaBor = typeof L !== "undefined";
if (!xaritaBor){
  const quti = document.getElementById("leaflet-uzb");
  if (quti) quti.innerHTML =
    `<div style="height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--matn-3)">
       <div><div style="font-size:15px;font-weight:650;color:#33383E">Xarita xizmati mavjud emas</div>
       <div style="font-size:13.5px;margin-top:6px">Tarmoq ulanishini tekshiring — hudud ro'yxati va filtrlar ishlaydi.</div></div>
     </div>`;
}
const uzMap = xaritaBor
  ? L.map("leaflet-uzb", {zoomControl:false, attributionControl:true, scrollWheelZoom:true}).setView([41.35, 64.4], 6)
  : null;
const uzXarita = xaritaBor && L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:18, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
});
if (xaritaBor) uzXarita.addTo(uzMap);
const uzSputnik = xaritaBor && L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom:18, attribution:"Tiles &copy; Esri"
});

const maxSon = Math.max(...HUDUDLAR.map(h=>parseInt(h[1].replace(/\s/g,""),10)));
/* O'zbekiston hududini yumshoq ohang bilan ajratish — soddalashtirilgan chegara
   ko'pburchagi (mamlakat masshtabida o'qiladi; faqat yengil to'ldirish va juda
   xira kontur — OSM chegaralari bilan kichik nomuvofiqlik ko'zga tashlanmasin). */
const UZ_CHEGARA = [
  [44.99,55.97],[45.57,58.55],[44.40,61.00],[43.50,61.95],[43.72,64.90],[42.90,66.10],
  [42.20,67.90],[41.95,69.05],[41.70,70.50],[41.60,71.70],[41.40,72.60],[40.90,73.05],
  [40.20,72.40],[39.90,71.70],[40.05,70.60],[40.00,69.30],[39.50,68.80],[39.00,68.60],
  [38.30,67.80],[37.22,67.28],[37.90,66.00],[38.50,64.90],[39.40,63.90],[40.00,62.60],
  [40.45,61.90],[41.20,60.05],[41.90,59.90],[42.30,59.00],[41.99,57.00],[42.90,56.00],
  [44.00,56.00]
];
if (xaritaBor){
  L.polygon(UZ_CHEGARA, {
    fillColor:"#78C802", fillOpacity:0.07,
    color:"#78C802", opacity:0.25, weight:1.2,
    interactive:false
  }).addTo(uzMap);
}
const viloyatQatlam = xaritaBor ? L.layerGroup().addTo(uzMap) : null;
if (xaritaBor) HUDUDLAR.forEach(h=>{
  const geo = HUDUD_GEO[h[0]];
  if (!geo) return;
  const son = parseInt(h[1].replace(/\s/g,""),10);
  const d = Math.round(34 + 30*Math.sqrt(son/maxSon));   // halqali belgida son sig'ishi uchun minimal 34px
  const rang = DARAJA_RANG[geo.daraja];
  const belgi = L.marker([geo.lat, geo.lng], {
    title: `${h[0]} — ${h[1]}`,
    alt: `${h[0]} — ${h[1]}`,
    // Dashboard klasterlari bilan bir xil zamonaviy belgi: oq doira + faollik rangidagi
    // halqa + ichida aktivlar SONI. Eski yassi nuqta o'rniga.
    icon: L.divIcon({className:"auga-klaster", html:`<span class="klaster-doira" style="--kr:${rang};width:${d}px;height:${d}px;font-size:${d>=52?14:12.5}px">${h[1].replace(/\s/g," ")}</span>`, iconSize:[d,d], iconAnchor:[d/2,d/2]})
  });
  viloyatQatlam.addLayer(belgi);
  belgi.bindTooltip(
    `<span class="pin-chip"><span class="pin-nuqta" style="background:${rang}"></span>${h[0]} — <b>${h[1]}</b></span>`,
    {direction:"top", offset:[0,-4], className:"auga-chip"}
  );
  belgi.on("click", ()=>{
    if (xaritaBor) uzMap.flyTo([geo.lat, geo.lng], 9, {duration:0.6});
    AUGA.toast(`${h[0]} bo'yicha batafsil`, "i-bino");
  });
});

/* ============================================================================
   Ikki bosqichli xarita (panel bilan bir xil naqsh):
   uzoq masshtab — viloyat bo'yicha ANIQ sonli halqa-belgi;
   yaqinlashganda (zoom >= 8) — o'sha viloyatning barcha obyektlari:
   turiga mos ikonli pinlar va oraliq klasterlar. Nuqtalar viloyat soni
   bo'yicha DETERMINLASHGAN tarzda hosil qilinadi — har yuklashda bir xil.
   ========================================================================== */
const TUR_ULUSH = [   // portfel bo'yicha tur taqsimoti (panel bilan bir nisbat)
  ["Turar-joy / Ofislar", .46, "--t-turar",  "i-uy"],
  ["Bo'sh yer maydoni",   .27, "--t-yer",    "i-yer"],
  ["Dacha",               .13, "--t-dacha",  "i-uy"],
  ["Davlat muassasasi",   .06, "--t-davlat", "i-qalqon"],
  ["Biznes markazi",      .05, "--t-biznes", "i-bino"],
  ["Savdo markazi",       .03, "--t-savdo",  "i-aktiv"]
];
const ranglarQiym = getComputedStyle(document.documentElement);
let hududUrugh = 20260824;
const hrnd = ()=>{ hududUrugh = (hududUrugh*1103515245 + 12345) & 0x7fffffff; return hududUrugh/0x7fffffff; };

const HUDUD_NUQTALARI = [];
HUDUDLAR.forEach(h=>{
  const geo = HUDUD_GEO[h[0]];
  if (!geo) return;
  const jami = parseInt(h[1].replace(/\s/g,""),10);
  TUR_ULUSH.forEach(([tur, ulush, rangVar, ikon], ti)=>{
    const soni = ti === TUR_ULUSH.length-1
      ? jami - HUDUD_NUQTALARI.filter(n=>n.hudud===h[0]).length   // qoldiq — jami ANIQ chiqsin
      : Math.round(jami*ulush);
    const rang = ranglarQiym.getPropertyValue(rangVar).trim();
    for (let i=0;i<soni;i++){
      const burchak = hrnd()*Math.PI*2, masofa = Math.sqrt(hrnd())*0.42;
      HUDUD_NUQTALARI.push({hudud:h[0], tur, rang, ikon,
        lat: geo.lat + masofa*Math.cos(burchak)*0.62,
        lng: geo.lng + masofa*Math.sin(burchak)});
    }
  });
});

const nuqtaQatlam = xaritaBor ? L.layerGroup().addTo(uzMap) : null;
function hududKlaster(nuqtalar, zoom){
  const qadam = zoom >= 12 ? 0 : 1.6/Math.pow(2, zoom-6);
  if (qadam === 0) return nuqtalar.map(n=>({tip:"nuqta", n}));
  const katak = new Map();
  nuqtalar.forEach(n=>{
    const k = Math.round(n.lat/qadam)+"|"+Math.round(n.lng/qadam);
    if (!katak.has(k)) katak.set(k,[]);
    katak.get(k).push(n);
  });
  const out=[];
  katak.forEach(g=>{
    if (g.length===1) out.push({tip:"nuqta", n:g[0]});
    else out.push({tip:"klaster", lat:g.reduce((a,n)=>a+n.lat,0)/g.length,
                   lng:g.reduce((a,n)=>a+n.lng,0)/g.length, guruh:g});
  });
  return out;
}

function hududDrillChiz(){
  if (!xaritaBor) return;
  const zoom = uzMap.getZoom();
  if (zoom <= 7){                       // umumiy ko'rinish — viloyat belgilar qatlami
    nuqtaQatlam.clearLayers();
    viloyatQatlam.addTo(uzMap);
    return;
  }
  uzMap.removeLayer(viloyatQatlam);     // yaqin ko'rinish — haqiqiy obyektlar
  nuqtaQatlam.clearLayers();
  const chegara = uzMap.getBounds().pad(0.2);
  const korinadigan = HUDUD_NUQTALARI.filter(n=>chegara.contains([n.lat,n.lng]));
  hududKlaster(korinadigan, zoom).forEach(el=>{
    if (el.tip==="nuqta"){
      const n = el.n;
      const m = L.marker([n.lat,n.lng],{title:`${n.hudud} — ${n.tur}`, alt:`${n.hudud} — ${n.tur}`,
        icon: L.divIcon({className:"auga-pin",
          html:`<span class="pin-ikon" style="--kr:${n.rang}"><svg><use href="#${n.ikon}"/></svg></span>`,
          iconSize:[30,30], iconAnchor:[15,15]})});
      m.bindPopup(`<div style="min-width:190px">
          <b style="font-size:13.5px">${n.tur}</b>
          <div style="font-size:12px;color:#5F6169;margin-top:3px">${n.hudud}</div>
          <a href="aktivlar.html" style="display:inline-block;margin-top:8px;background:#78C802;color:#fff;border-radius:9px;padding:5px 12px;font-size:12px;font-weight:700;text-decoration:none">Reyestrda ochish</a>
        </div>`,{offset:[0,-4]});
      nuqtaQatlam.addLayer(m);
    } else {
      const sanoq={}; el.guruh.forEach(n=>{sanoq[n.rang]=(sanoq[n.rang]||0)+1;});
      const rang=Object.entries(sanoq).sort((a,b)=>b[1]-a[1])[0][0];
      const d = el.guruh.length>=200?56 : el.guruh.length>=60?48 : 38;
      const m = L.marker([el.lat,el.lng],{title:el.guruh.length+" ta obyekt",
        icon: L.divIcon({className:"auga-klaster",
          html:`<span class="klaster-doira" style="--kr:${rang};width:${d}px;height:${d}px">${el.guruh.length}</span>`,
          iconSize:[d,d], iconAnchor:[d/2,d/2]})});
      m.on("click", ()=> uzMap.flyTo([el.lat,el.lng], Math.min(uzMap.getZoom()+2, 13), {duration:0.45}));
      nuqtaQatlam.addLayer(m);
    }
  });
}
if (xaritaBor){
  uzMap.on("zoomend moveend", hududDrillChiz);
}

/* Hudud filtri — xaritani tanlangan hududga uchiradi va ro'yxatda ajratib ko'rsatadi */
document.getElementById("hudud-filtr").addEventListener("tanlov", e=>{
  document.querySelectorAll(".hudud-band").forEach(b=>b.classList.remove("faol"));
  if (e.detail === "Barcha hududlar"){
    if (xaritaBor) uzMap.flyTo([41.35, 64.4], 6, {duration:0.6});
    return;
  }
  const nom = HUDUDLAR.map(h=>h[0]).find(n=>n.startsWith(e.detail)) || e.detail;
  const geo = HUDUD_GEO[nom];
  if (geo){
    if (xaritaBor) uzMap.flyTo([geo.lat, geo.lng], 9, {duration:0.6});
    AUGA.toast(`${nom} bo'yicha batafsil`, "i-bino");
    const band = Array.from(document.querySelectorAll(".hudud-band")).find(b=>b.textContent.includes(nom));
    if (band) band.classList.add("faol");
  }
});

/* 2D/3D rejim — haqiqiy qatlam almashtirish (sxematik ↔ sputnik) */
const r2 = document.getElementById("r-2d"), r3 = document.getElementById("r-3d");
[r2,r3].forEach(b=>b.addEventListener("click", ()=>{
  [r2,r3].forEach(x=>x.classList.remove("aktiv"));
  b.classList.add("aktiv");
  if (!xaritaBor) return AUGA.toast("Xarita xizmati mavjud emas");
  if (b.id === "r-3d"){ uzMap.removeLayer(uzXarita); uzSputnik.addTo(uzMap); AUGA.toast("Sputnik ko'rinishi yoqildi", "i-xarita"); }
  else { uzMap.removeLayer(uzSputnik); uzXarita.addTo(uzMap); AUGA.toast("Sxematik xarita ko'rinishi", "i-xarita"); }
}));
});
</script>
</body>
