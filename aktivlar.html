<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Obyektlar ro'yxati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auga.css">
<style>
/* ---- Obyektlar ro'yxati (ekran 3) ---- */
.asosiy-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.asosiy-grid.inspector-ochiq{grid-template-columns:minmax(0,1fr) 380px}

.filtr-qator{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.f-izlash{
  display:flex;align-items:center;gap:10px;flex:1;min-width:220px;max-width:400px;
  background:var(--karta);border-radius:14px;height:48px;padding:0 18px;box-shadow:var(--soya);
}
.f-izlash input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:14.5px;min-width:0}
.f-izlash input::placeholder{color:var(--matn-4)}
.f-izlash .ic{width:19px;height:19px;color:var(--matn-3)}
.filtr-qator .tanlov{width:auto;min-width:170px;background:var(--karta);border:none;box-shadow:var(--soya)}
.f-tugma{
  margin-left:auto;display:flex;align-items:center;gap:9px;height:48px;padding:0 18px;
  background:var(--karta);border-radius:14px;box-shadow:var(--soya);
  font-size:14.5px;font-weight:650;color:#23272C;transition:box-shadow var(--tez);
}
.f-tugma:hover{box-shadow:0 1px 2px rgba(23,26,31,.05),0 10px 28px rgba(23,26,31,.09)}
.f-tugma .ic{width:18px;height:18px;color:#43484E}

.jadval-korpus{padding:6px 4px 4px}
.jadval th:first-child{padding-left:22px}
.jadval td:first-child{padding-left:22px}
.jadval th .info{display:inline-grid;place-items:center;width:16px;height:16px;vertical-align:-3px;margin-left:5px;color:var(--matn-4);cursor:help}
.jadval tbody tr{cursor:pointer}
.jadval tbody tr.tanlangan{background:#F9FCEB;box-shadow:inset 0 1px 0 #E8F3C8, inset 0 -1px 0 #E8F3C8}
.jadval tbody tr.tanlangan:hover{background:#F7FBE4}
.obyekt-katak img{width:64px;height:52px}
.status-katak{display:flex;align-items:center;gap:8px;font-size:14.5px;color:#33383E}
.status-katak .nuqta{width:8px;height:8px;border-radius:99px}
.ball-halqa{position:relative;width:46px;height:46px;display:grid;place-items:center}
.ball-halqa b{position:absolute;font-size:13px;font-weight:700;color:#17191C}

/* Inspector */
.inspektor{position:sticky;top:20px;display:none}
.asosiy-grid.inspector-ochiq .inspektor{display:block}
.insp-bosh{display:flex;align-items:flex-start;gap:10px}
.insp-bosh h2{font-size:20px;font-weight:750;color:#17191C;line-height:1.2}
.insp-bosh .kod{font-size:13.5px;color:var(--matn-4);margin-top:4px}
.insp-yop{margin-left:auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#5B6168;transition:background var(--tez)}
.insp-yop:hover{background:#F0F1F4;color:#17191C}
.insp-tablar{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--chiziq)}
.insp-tab{
  padding:9px 12px 11px;font-size:14px;font-weight:600;color:var(--matn-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--tez);
}
.insp-tab:hover{color:#33383E}
.insp-tab.aktiv{color:#17191C;border-bottom-color:var(--yashil)}
.insp-rasm{position:relative;margin-top:16px;border-radius:16px;overflow:hidden;background:#FAFAF8}
.insp-rasm img{width:100%;height:240px;object-fit:contain}
.insp-3d{
  position:absolute;left:12px;bottom:12px;height:34px;padding:0 13px;border-radius:10px;
  background:var(--karta);box-shadow:var(--soya-pin);font-size:12.5px;font-weight:750;color:#2B3036;
}
.insp-kengay{
  position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:10px;
  background:var(--karta);box-shadow:var(--soya-pin);display:grid;place-items:center;color:#2B3036;
}
.insp-kengay .ic{width:16px;height:16px}
.tafsilot{margin-top:14px}
.tafsilot-qator{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #F2F3F5;font-size:14px}
.tafsilot-qator:last-child{border-bottom:none}
.tafsilot-qator .ic{width:18px;height:18px;color:var(--matn-3)}
.tafsilot-qator .yorliq{color:var(--matn-3)}
.tafsilot-qator .qiymat{margin-left:auto;font-weight:650;color:#17191C;text-align:right}
.mini-ball{display:inline-flex;align-items:center;gap:7px}
.mini-ball .halqacha{width:30px;height:30px;position:relative;display:grid;place-items:center}
.mini-ball .halqacha b{position:absolute;font-size:9.5px;font-weight:750;color:#3E7C0A}
.insp-tugma{
  width:100%;height:50px;margin-top:16px;border-radius:13px;background:#F0F1F4;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#23272C;transition:background var(--tez);
}
.insp-tugma:hover{background:#E8EAEE}
@media (max-width:1400px){
  .asosiy-grid.inspector-ochiq{grid-template-columns:minmax(0,1fr)}
  .inspektor{position:fixed;right:16px;top:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);z-index:60;overflow-y:auto;box-shadow:var(--soya-modal)}
}
</style>
</head>

          <button class="s-tugma" id="s-oldingi" aria-label="Oldingi sahifa" disabled><svg class="ic" style="width:16px;height:16px"><use href="#i-chap"/></svg></button>

</div>

const tbody = document.querySelector("#obyekt-jadval tbody");
const grid = document.getElementById("asosiy-grid");
let tanlanganId = "green-tower";

function halqaSVG(ball, olcham, qalinlik){
  const r = (olcham - qalinlik)/2, C = 2*Math.PI*r;
  // style="overflow:visible" shart: halqa strokeining tashqi chekkasi svg quti chekkasiga
  // aynan tegib turadi (nol-margin geometriya), shuning uchun overflow:hidden standart qiymatida
  // filter="url(#depth-sm)" soyasi butunlay kesilib qolar edi (spec 4-qoida: soya ko'rinishi shart).
  return `<svg width="${olcham}" height="${olcham}" viewBox="0 0 ${olcham} ${olcham}" style="overflow:visible">
    <circle cx="${olcham/2}" cy="${olcham/2}" r="${r}" fill="none" stroke="#EAF3D4" stroke-width="${qalinlik}"/>
    <circle cx="${olcham/2}" cy="${olcham/2}" r="${r}" fill="none" stroke="url(#grad-ring-3d)" stroke-width="${qalinlik}"
      stroke-linecap="round" stroke-dasharray="${(ball/100*C).toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 ${olcham/2} ${olcham/2})" filter="url(#depth-sm)"/>
  </svg>`;
}

function jadvalChiz(royxat){
  tbody.innerHTML = royxat.length ? royxat.map(o=>`
    <tr data-id="${o.id}" class="${o.id===tanlanganId?"tanlangan":""}" tabindex="0" aria-selected="${o.id===tanlanganId}">
      <td>
        <span class="obyekt-katak">
          <img src="${o.rasm}" alt="">
          <span><span class="nom">${o.nom}</span><br><span class="sub">${o.kod}</span></span>
        </span>
      </td>
      <td>${o.hudud}</td>
      <td>${o.tur}</td>
      <td><span class="status-katak"><span class="nuqta" style="background:${o.srang}"></span>${o.status}</span></td>
      <td><b>${o.qiymat}</b></td>
      <td><span class="ball-halqa">${halqaSVG(o.ball,46,4)}<b>${o.ball}</b></span></td>
    </tr>`).join("") : `
    <tr><td colspan="6"><div class="bosh-holat"><span class="doira"><svg class="ic"><use href="#i-aktiv"/></svg></span><h3>Obyekt topilmadi</h3><p>Qidiruv yoki filtrga mos obyekt yo'q.</p></div></td></tr>`;
  document.getElementById("jami-son").textContent = royxat.length;

  tbody.querySelectorAll("tr[data-id]").forEach(tr=>{
    const tanla = ()=>{
      tanlanganId = tr.dataset.id;
      tbody.querySelectorAll("tr[data-id]").forEach(r=>{r.classList.toggle("tanlangan", r===tr); r.setAttribute("aria-selected", String(r===tr));});
      inspektorChiz(OBYEKTLAR.find(o=>o.id===tanlanganId));
      grid.classList.add("inspector-ochiq");
    };
    tr.addEventListener("click", tanla);
    tr.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();tanla();} });
  });
}

      <button class="insp-tab" data-tab="moliyaviy">Moliyaviy</button>

        <a class="insp-kengay" href="aktiv.html?id=${o.id}" aria-label="To'liq ochish"><svg class="ic"><use href="#i-kengay"/></svg></a>
      </div>
      <div class="tafsilot">
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-aktiv"/></svg><span class="yorliq">Turi</span><span class="qiymat">${o.tur}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-pin"/></svg><span class="yorliq">Hudud</span><span class="qiymat">${o.hududToliq || o.hudud}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-uy"/></svg><span class="yorliq">Manzil</span><span class="qiymat">${o.manzil}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-kengay"/></svg><span class="yorliq">Maydon</span><span class="qiymat">${o.maydon}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-kalendar"/></svg><span class="yorliq">Qurilgan sana</span><span class="qiymat">${o.sana}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-info"/></svg><span class="yorliq">Holat</span><span class="qiymat"><span class="status-katak"><span class="nuqta" style="background:${o.srang}"></span>${o.status}</span></span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-daromad"/></svg><span class="yorliq">Qiymati</span><span class="qiymat">${o.qiymat}</span></div>
        <div class="tafsilot-qator"><svg class="ic"><use href="#i-belgi-doira"/></svg><span class="yorliq">Sifat balli</span>
          <span class="qiymat mini-ball"><span class="halqacha">${halqaSVG(o.ball,30,3)}<b>${o.ball}</b></span> / 100</span></div>
      </div>
    </div>

    <div data-panel="moliyaviy" hidden>
      <div class="tafsilot">
        <div class="tafsilot-qator"><span class="yorliq">Balans qiymati</span><span class="qiymat">${o.qiymat}</span></div>
        <div class="tafsilot-qator"><span class="yorliq">Yillik ijara daromadi</span><span class="qiymat">${o.moliya.daromad}</span></div>
        <div class="tafsilot-qator"><span class="yorliq">Yillik xarajatlar</span><span class="qiymat">${o.moliya.xarajat}</span></div>
        <div class="tafsilot-qator"><span class="yorliq">Soliq (yillik)</span><span class="qiymat">${o.moliya.soliq}</span></div>
        <div class="tafsilot-qator"><span class="yorliq">Sug'urta holati</span><span class="qiymat"><span class="chip ${o.moliya.sugurta==="Amalda"?"chip-yashil":"chip-qizil"}"><span class="nuqta"></span>${o.moliya.sugurta}</span></span></div>
      </div>
    </div>

    <div data-panel="hujjatlar" hidden>
      <div class="tafsilot">
        ${o.hujjatlar.map(([nom,hajm])=>
          `<div class="tafsilot-qator"><svg class="ic"><use href="#i-hujjat"/></svg><span class="yorliq">${nom}</span>
            <span class="qiymat"><button class="amal-tugma" data-toast="${nom} yuklab olinmoqda" aria-label="Yuklab olish"><svg class="ic"><use href="#i-yuklab"/></svg></button></span></div>`
        ).join("")}
      </div>
    </div>

    <div data-panel="tarix" hidden>
      <div class="tafsilot">
        ${o.tarix.map(([vaqt,matn,ikon])=>
          `<div class="tafsilot-qator"><svg class="ic"><use href="#${ikon}"/></svg><span class="yorliq">${vaqt}</span><span class="qiymat">${matn}</span></div>`
        ).join("")}
      </div>
    </div>

    <a class="insp-tugma" href="aktiv.html?id=${o.id}">To'liq ma'lumot</a>`;

  document.getElementById("insp-yop").addEventListener("click", ()=>{
    grid.classList.remove("inspector-ochiq");
    tbody.querySelectorAll("tr").forEach(r=>{r.classList.remove("tanlangan");r.setAttribute("aria-selected","false");});
    tanlanganId = null;
  });
  document.querySelectorAll(".insp-tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      document.querySelectorAll(".insp-tab").forEach(x=>x.classList.remove("aktiv"));
      t.classList.add("aktiv");
      document.querySelectorAll("#inspektor [data-panel]").forEach(p=>p.hidden = p.dataset.panel !== t.dataset.tab);
    });
  });
}

/* Filtrlash */
const holatFiltri = {qidiruv:"", hudud:"Barcha hududlar", tur:"Barcha turlar", status:"Barcha statuslar"};
function qollash(){
  const q = holatFiltri.qidiruv.toLowerCase();
  const royxat = OBYEKTLAR.filter(o=>
    (!q || (o.nom+" "+o.kod).toLowerCase().includes(q)) &&
    (holatFiltri.hudud==="Barcha hududlar" || o.hudud===holatFiltri.hudud) &&
    (holatFiltri.tur==="Barcha turlar" || o.tur===holatFiltri.tur) &&
    (holatFiltri.status==="Barcha statuslar" || o.status===holatFiltri.status)
  );
  jadvalChiz(royxat);
}
document.getElementById("izlash").addEventListener("input", e=>{ holatFiltri.qidiruv = e.target.value; qollash(); });
document.getElementById("f-hudud").addEventListener("tanlov", e=>{ holatFiltri.hudud = e.detail; qollash(); });
document.getElementById("f-tur").addEventListener("tanlov", e=>{ holatFiltri.tur = e.detail; qollash(); });
document.getElementById("f-status").addEventListener("tanlov", e=>{ holatFiltri.status = e.detail; qollash(); });

/* URL parametrlari (dashboarddan kelgan havolalar) */
const p = new URLSearchParams(location.search);
if (p.get("qidiruv")){ holatFiltri.qidiruv = p.get("qidiruv"); document.getElementById("izlash").value = holatFiltri.qidiruv; }
if (p.get("tur")){
  const t = p.get("tur");
  const mos = {"Biznes markazi":"Biznes markazi","Savdo markazi":"Savdo markazi","Dacha":"Dacha","Bo'sh yer":"Yer maydoni","Turar-joy":"Turar-joy","Davlat muassasasi":"Barcha turlar","Ofis":"Ofis"};
  holatFiltri.tur = mos[t] || "Barcha turlar";
  document.querySelector("#f-tur .t-yorliq").textContent = holatFiltri.tur;
}
if (p.get("holat")){
  const h = p.get("holat");
  holatFiltri.status = ["Faol","Rejalashtirilgan","Ta'mirda","Nofaol"].includes(h) ? h : "Barcha statuslar";
  document.querySelector("#f-status .t-yorliq").textContent = holatFiltri.status;
}

/* Eksport dropdown */
const et = document.getElementById("eksport-tugma"), em = document.getElementById("eksport-menyu");
et.addEventListener("click", e=>{
  e.stopPropagation();
  const ochiq = em.classList.contains("ochiq");
  document.querySelectorAll(".menyu-popover.ochiq").forEach(x=>x.classList.remove("ochiq"));
  em.classList.toggle("ochiq", !ochiq);
});
em.querySelectorAll("button").forEach(b=>b.addEventListener("click", e=>{
  e.stopPropagation(); em.classList.remove("ochiq");
  AUGA.toast(b.dataset.f+" eksport shakllantirildi", "i-yuklab");
}));

/* Yangi obyekt */
const STATUS_RANG = {"Faol":"#22B14C","Rejalashtirilgan":"#4A90F2","Ta'mirda":"#F2C230","Nofaol":"#9AA1A9"};
// Hech qanday real surat mavjud bo'lmagan yangi obyektlar uchun neytral belgi (bosh-holat bilan bir xil ranglar) —
// mavjud obyektlarning haqiqiy suratlaridan birini "qarz olib" ko'rsatish yolg'on bo'lar edi.
const RASM_YOQ = "data:image/svg+xml,"+encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 52'>"+
  "<rect width='64' height='52' fill='#F0F1F4'/>"+
  "<path d='M22 38 L22 18 L36 18 L36 38 M36 26 L44 26 L44 38 M16 38 L48 38' stroke='#6A7078' stroke-width='1.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/>"+
  "</svg>"
);
function pulFormat(matn){
  const raqam = (matn||"").replace(/[^\d]/g,"");
  return raqam ? raqam.replace(/\B(?=(\d{3})+(?!\d))/g," ")+" so'm" : "0 so'm";
}
function idYarat(nom){
  let asos = nom.toLowerCase().replace(/[ʻʼ'`’]/g,"").trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if (!asos) asos = "obyekt";
  let id = asos, i = 2;
  while (OBYEKTLAR.some(o=>o.id===id)){ id = asos+"-"+i; i++; }
  return id;
}
function kodYarat(nom){
  const sozlar = nom.trim().split(/\s+/).filter(Boolean);
  const bosh = (sozlar.length>=2 ? sozlar[0][0]+sozlar[1][0] : (sozlar[0]||"OB").slice(0,2)).toUpperCase();
  const tartib = String(OBYEKTLAR.length+1).padStart(3,"0");
  return `${bosh}-${new Date().getFullYear()}-${tartib}`;
}

document.getElementById("yangi-obyekt").addEventListener("click", ()=>{
  const hududlar = JSON.parse(document.getElementById("f-hudud").dataset.variantlar).slice(1);
  const turlar = JSON.parse(document.getElementById("f-tur").dataset.variantlar).slice(1);
  const statuslar = JSON.parse(document.getElementById("f-status").dataset.variantlar).slice(1);

  AUGA.modal("Yangi obyekt qo'shish",
    `<div style="display:grid;gap:14px;margin-top:6px">
      <div><label class="maydon-yorliq">Obyekt nomi</label><div class="kirish"><svg class="ic"><use href="#i-bino"/></svg><input id="yo-nom" placeholder="Masalan: Chilonzor Plaza"></div></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
        <div><label class="maydon-yorliq">Hudud</label><div class="kirish"><svg class="ic"><use href="#i-pin"/></svg><select id="yo-hudud">${hududlar.map(h=>`<option>${h}</option>`).join("")}</select></div></div>
        <div><label class="maydon-yorliq">Turi</label><div class="kirish"><svg class="ic"><use href="#i-aktiv"/></svg><select id="yo-tur">${turlar.map(t=>`<option>${t}</option>`).join("")}</select></div></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
        <div><label class="maydon-yorliq">Status</label><div class="kirish"><select id="yo-status">${statuslar.map(s=>`<option>${s}</option>`).join("")}</select></div></div>
        <div><label class="maydon-yorliq">Qiymati (so'm)</label><div class="kirish"><svg class="ic"><use href="#i-daromad"/></svg><input id="yo-qiymat" placeholder="Masalan: 1 500 000 000"></div></div>
      </div>
      <div><label class="maydon-yorliq">Manzil</label><div class="kirish"><svg class="ic"><use href="#i-pin"/></svg><input id="yo-manzil" placeholder="Toshkent sh., ..."></div></div>
    </div>`,
    { okMatn:"Qo'shish", ok(){
      const nom = document.getElementById("yo-nom").value.trim();
      const hudud = document.getElementById("yo-hudud").value;
      const tur = document.getElementById("yo-tur").value;
      const status = document.getElementById("yo-status").value;
      const manzil = document.getElementById("yo-manzil").value.trim();
      const qiymat = pulFormat(document.getElementById("yo-qiymat").value);
      const yangi = {
        id: idYarat(nom), nom, kod: kodYarat(nom),
        hudud, tur, status, srang: STATUS_RANG[status] || "#9AA1A9",
        qiymat, ball: 0, rasm: RASM_YOQ,
        manzil: manzil || "—", maydon: "—", sana: "—",
        moliya: {daromad:"0 so'm", xarajat:"0 so'm", soliq:"0 so'm", sugurta:"Yo'q"},
        hujjatlar: [],
        tarix: [["Hozirgina","Obyekt ro'yxatga olindi","i-foyd"]]
      };
      OBYEKTLAR.push(yangi);
      tanlanganId = yangi.id;
      qollash();
      grid.classList.add("inspector-ochiq");
      inspektorChiz(yangi);
      AUGA.toast("Yangi obyekt ro'yxatga olindi");
    } });

  /* AUGA.modal "Qo'shish" bosilganda modalni har doim yopadi (yop() so'ng ok() chaqiradi) —
     shuning uchun tekshiruv shu yerda, capture bosqichida, alohida bajariladi: nom bo'sh
     bo'lsa stopPropagation chaqirilib, hodisa tugmaning o'z (bubble) tinglovchisiga
     yetib bormaydi va modal ochiq qoladi. */
  const modallar = document.querySelectorAll(".modal-fon");
  const fon = modallar[modallar.length-1];
  fon.addEventListener("click", e=>{
    if (!e.target.closest("[data-m-ok]")) return;
    if (!document.getElementById("yo-nom").value.trim()){
      e.stopPropagation();
      AUGA.toast("Obyekt nomini kiriting");
    }
  }, true);
});

/* Boshlash */
qollash();
inspektorChiz(OBYEKTLAR[0]);
});
</script>
</body>
</html>
