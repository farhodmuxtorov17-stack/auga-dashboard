<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Sotuv jarayoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auga.css">
<style>
/* ---- Sotuv jarayoni (MIB obyektlarini realizatsiya qilish) ---- */
.st-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.st-kpi .karta{display:flex;align-items:center;gap:13px;padding:18px 20px}
.st-kpi .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;box-shadow:var(--chuqur-tile)}
.st-kpi .tile .ic{width:21px;height:21px}
.st-kpi .tile.yashil{background:#EAF6D3;color:#4F8F08}
.st-kpi .tile.kok{background:#E7F0FE;color:#2F6BCF}
.st-kpi .tile.sariq{background:#FFF6DE;color:#9A6E00}
.st-kpi .tile.binafsha{background:#F3EBFE;color:#8A4BD8}
.st-kpi .yorliq{font-size:13.5px;color:var(--matn-3)}
.st-kpi b{display:block;font-size:24px;font-weight:750;line-height:1.2}

.st-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.bosqich-ustunlar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.b-ustun h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:750;padding:0 4px 10px}
.b-ustun h4 .son{margin-left:auto;font-size:11.5px;font-weight:750;background:#F0F1F4;border-radius:99px;padding:2px 8px;color:#5B6168}
.b-ustun h4 .nuqta{width:8px;height:8px;border-radius:99px}
.s-karta{
  width:100%;text-align:left;background:var(--karta);border:1px solid var(--chiziq);border-radius:14px;
  padding:11px;margin-bottom:10px;transition:box-shadow var(--tez),border-color var(--tez);
}
.s-karta:hover{box-shadow:var(--soya)}
.s-karta.faol{border-color:#B7E534;background:#FBFEF2;box-shadow:0 0 0 1px #B7E534}
.s-karta img{width:100%;height:84px;object-fit:cover;border-radius:10px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.s-karta b{display:block;font-size:13px;font-weight:700;margin-top:8px}
.s-karta .narx{display:block;font-size:12.5px;font-weight:750;color:#3E7C0A;margin-top:2px}
.s-karta .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--matn-4);margin-top:4px}
.s-karta .meta .ic{width:13px;height:13px}

/* Tanlangan obyekt paneli */
.tanlangan-panel h3{font-size:17px;font-weight:750}
.tp-obyekt{display:flex;gap:13px;margin-top:12px}
.tp-obyekt img{width:104px;height:84px;object-fit:cover;border-radius:12px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.tp-obyekt b{display:block;font-size:15.5px;font-weight:750}
.tp-obyekt .kod{display:block;font-size:12px;color:var(--matn-4)}
.tp-obyekt .narx{display:block;font-size:14px;font-weight:750;color:#3E7C0A;margin-top:4px}
.tp-obyekt .chip{margin-top:6px}
.tp-blok{margin-top:14px;padding-top:12px;border-top:1px solid var(--chiziq)}
.tp-blok h4{font-size:14.5px;font-weight:750;margin-bottom:6px;display:flex;align-items:center}
.tp-blok h4 .son{margin-left:8px;font-size:11.5px;background:#EAF6D3;color:#3E7C0A;border-radius:99px;padding:2px 8px}
.mijoz-band{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F2F3F5}
.mijoz-band:last-of-type{border-bottom:none}
.mijoz-band .avatar{width:36px;height:36px}
.mijoz-band b{display:block;font-size:13.5px;font-weight:650}
.mijoz-band span{display:block;font-size:12px;color:var(--matn-4)}
.mijoz-band .teg{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.teg-korik{background:#E7F0FE;color:#2F6BCF}
.teg-muzokara{background:#FFF6DE;color:#9A6E00}
.teg-tayyor{background:#EBF7D8;color:#3E7C0A}
.tp-amal{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.tp-amal .a{
  display:flex;align-items:center;gap:11px;height:48px;padding:0 15px;border-radius:12px;
  border:1px solid var(--kirish-chiziq);font-size:13.5px;font-weight:650;color:#23272C;
  transition:background var(--tez);text-align:left;
}
.tp-amal .a:hover{background:#F6F7F8}
.tp-amal .a .ic{width:17px;height:17px;color:#5B6168}
.tp-amal .yakun{
  height:54px;border-radius:13px;background:#B7E534;color:#20300A;border:none;
  font-size:15px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;
}
.tp-amal .yakun:hover{background:#ABD92C}
.tp-amal .yakun .ic{width:19px;height:19px;color:#20300A}
@media (max-width:1500px){.st-kpi{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bosqich-ustunlar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:1200px){.st-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:800px){.bosqich-ustunlar{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.st-kpi span{white-space:normal;min-width:0}}
@media (max-width:480px){.st-kpi .karta,.st-kpi > *{flex-wrap:wrap;min-width:0}}
</style>
</head>
<body data-sahifa="sotuv">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="sahifa-qator">
      <div>
        <h1>Sotuv jarayoni</h1>
        <div class="sahifa-izoh">MIB obyektlarini realizatsiya qilish: ko'rikdan hujjatlargacha yagona jarayon</div>
      </div>
      <div class="sahifa-harakat">
        <a class="tugma tugma-oq" href="mib-qabul.html" data-rol-yoq="rahbar texnik"><svg class="ic"><use href="#i-aktiv"/></svg>MIB'dan qabul qilish</a>
        <a class="tugma tugma-yashil" href="masofaviy-korik.html" data-ruxsat="smart-access"><svg class="ic"><use href="#i-kamera"/></svg>Masofaviy ko'rik boshlash</a>
      </div>
    </div>

    <!-- KPI -->
    <section class="st-kpi">
      <div class="karta">
        <span class="tile yashil"><svg class="ic"><use href="#i-daromad"/></svg></span>
        <span><span class="yorliq">Sotuvda</span><b id="kpi-sotuvda">6</b></span>
      </div>
      <div class="karta">
        <span class="tile kok"><svg class="ic"><use href="#i-kamera"/></svg></span>
        <span><span class="yorliq">Ko'rik belgilangan</span><b>5</b></span>
      </div>
      <div class="karta">
        <span class="tile sariq"><svg class="ic"><use href="#i-tashrif"/></svg></span>
        <span><span class="yorliq">Muzokarada</span><b>3</b></span>
      </div>
      <a class="karta" href="arxiv.html">
        <span class="tile binafsha"><svg class="ic"><use href="#i-papka"/></svg></span>
        <span><span class="yorliq">Shu oy sotilgan</span><b>5</b></span>
      </a>
    </section>

    <div class="st-grid">

      <!-- Bosqichlar -->
      <div class="karta">
        <div class="bosqich-ustunlar" id="bosqichlar"></div>
      </div>

      <!-- Tanlangan obyekt -->
      <aside class="karta tanlangan-panel" id="tanlangan-panel"></aside>
    </div>
  </main>
</div>
</div>

<script src="auga.js"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{

const AVATAR = `<span class="avatar"><svg viewBox="0 0 34 34" style="width:28px;height:28px;display:block;margin:4px auto 0"><circle cx="17" cy="12" r="6.5" fill="#8B94A3"/><path d="M4 34c1.6-8 7-11.5 13-11.5S28.4 26 30 34z" fill="#8B94A3"/></svg></span>`;

const OBYEKTLAR = [
  {id:1, nom:"Chorvoq dacha", kod:"CH-2023-045 · MIB-2025-0871", narx:"1 850 000 000 so'm", rasm:"assets/bino_dacha.png",
   bosqich:"tayyorlanmoqda", korik:1, mijozlar:[["Sardor Alimov","+998 90 111-22-33","korik","Ko'rik 26-may"]]},
  {id:2, nom:"Humo Office", kod:"HO-2023-021 · MIB-2025-0912", narx:"6 750 000 000 so'm", rasm:"assets/bino_humo.png",
   bosqich:"elon", korik:2, mijozlar:[["Business Pro Ltd","B2B mijoz","korik","Ko'rik 27-may"],["Malika Qodirova","+998 93 555-66-77","korik","Ko'rik so'raldi"]]},
  {id:3, nom:"Sergeli ombori", kod:"SO-2024-112 · MIB-2026-0034", narx:"4 200 000 000 so'm", rasm:"assets/bino_9.png",
   bosqich:"korik", korik:2, mijozlar:[["Agro Invest","B2B mijoz","muzokara","Muzokarada"],["Kamron Aliyev","+998 90 777-88-99","korik","Ko'rik 25-may"],["Logistics Group","B2B mijoz","korik","Ko'rik 28-may"]]},
  {id:4, nom:"Yashnobod yer maydoni", kod:"YM-2024-078 · MIB-2025-1204", narx:"3 200 000 000 so'm", rasm:"assets/bino_yer.png",
   bosqich:"korik", korik:0, mijozlar:[["Qurilish Invest","B2B mijoz","muzokara","Narx kelishilmoqda"]]},
  {id:5, nom:"Mega Mall (B blok)", kod:"MM-2022-013 · MIB-2025-0765", narx:"9 800 000 000 so'm", rasm:"assets/bino_mall.png",
   bosqich:"rasmiylashtirish", korik:0, mijozlar:[["Retail Group","B2B mijoz · G'olib taklif","tayyor","Hujjatlar tayyorlanmoqda"]]},
  {id:6, nom:"Nurafshon kvartirasi", kod:"NK-2024-201 · MIB-2026-0011", narx:"780 000 000 so'm", rasm:"assets/bino_turar.png",
   bosqich:"rasmiylashtirish", korik:0, mijozlar:[["Umid Soliyev","+998 94 222-33-44","tayyor","To'lov kutilmoqda"]]}
];
document.addEventListener("DOMContentLoaded", ()=>{ const el=document.getElementById("kpi-sotuvda"); if (el) el.textContent = OBYEKTLAR.length; });
const BOSQICHLAR = [
  ["tayyorlanmoqda","Sotuvga tayyorlanmoqda","#F2C230"],
  ["elon","E'lon qilingan","#3B82F6"],
  ["korik","Ko'rik / Muzokara","#8CD121"],
  ["rasmiylashtirish","Rasmiylashtirish","#9B59F5"]
];
let faolId = 3;

function bosqichChiz(){
  document.getElementById("bosqichlar").innerHTML = BOSQICHLAR.map(b=>{
    const royxat = OBYEKTLAR.filter(o=>o.bosqich===b[0]);
    return `
    <div class="b-ustun">
      <h4><span class="nuqta" style="background:${b[2]}"></span>${b[1]}<span class="son">${royxat.length}</span></h4>
      ${royxat.map(o=>`
        <button class="s-karta ${o.id===faolId?"faol":""}" data-id="${o.id}">
          <img src="${o.rasm}" alt="">
          <b>${o.nom}</b>
          <span class="narx">${o.narx}</span>
          <span class="meta"><svg class="ic"><use href="#i-foyd"/></svg>${o.mijozlar.length} mijoz${o.korik?` · <svg class="ic"><use href="#i-kamera"/></svg>${o.korik} ko'rik`:""}</span>
        </button>`).join("")}
    </div>`;
  }).join("");
  document.querySelectorAll(".s-karta").forEach(k=>{
    k.addEventListener("click", ()=>{ faolId = +k.dataset.id; bosqichChiz(); panelChiz(); });
  });
}

function panelChiz(){
  const o = OBYEKTLAR.find(x=>x.id===faolId);
  const bosqichNomi = BOSQICHLAR.find(b=>b[0]===o.bosqich)[1];
  document.getElementById("tanlangan-panel").innerHTML = `
    <h3>Tanlangan obyekt</h3>
    <div class="tp-obyekt">
      <img src="${o.rasm}" alt="${o.nom}">
      <span>
        <b>${o.nom}</b>
        <span class="kod">${o.kod}</span>
        <span class="narx">${o.narx}</span>
        <span class="chip chip-sariq" style="height:24px">${bosqichNomi}</span>
      </span>
    </div>

    <div class="tp-blok">
      <h4>Potensial mijozlar<span class="son">${o.mijozlar.length}</span></h4>
      ${o.mijozlar.map(m=>`
        <div class="mijoz-band">
          ${AVATAR}
          <span><b>${m[0]}</b><span>${m[1]}</span></span>
          <span class="teg teg-${m[2]}">${m[3]}</span>
        </div>`).join("")}
      <button class="tp-amal a" style="margin-top:9px;width:100%" id="mijoz-qoshish">
        <svg class="ic"><use href="#i-qoshish"/></svg>Mijoz qo'shish
      </button>
    </div>

    <div class="tp-blok">
      <h4>Amallar</h4>
      <div class="tp-amal">
        <a class="a" href="masofaviy-korik.html" data-ruxsat="smart-access"><svg class="ic"><use href="#i-kamera"/></svg>Masofaviy ko'rik boshlash</a>
        <a class="a" href="jonli-tashrif.html" data-ruxsat="smart-access"><svg class="ic"><use href="#i-qulf"/></svg>Face ID orqali eshik ochish</a>
        <a class="a" href="monitoring.html"><svg class="ic"><use href="#i-monitor"/></svg>Kameralardan kuzatish</a>
        <a class="a" href="hujjatlar.html"><svg class="ic"><use href="#i-hujjat"/></svg>Obyekt hujjatlari</a>
        <button class="yakun" id="sotuv-yakunlash"><svg class="ic"><use href="#i-belgi-doira"/></svg>Sotuvni yakunlash</button>
      </div>
    </div>`;

  document.getElementById("mijoz-qoshish").addEventListener("click", ()=>{
    AUGA.modal("Yangi mijoz qo'shish — "+o.nom,
      `<div style="display:grid;gap:13px;margin-top:6px">
        <div><label class="maydon-yorliq">Ism yoki tashkilot nomi</label><div class="kirish"><svg class="ic"><use href="#i-foyd"/></svg><input id="mij-nom"></div></div>
        <div><label class="maydon-yorliq">Telefon yoki izoh</label><div class="kirish"><input id="mij-aloqa" placeholder="+998 __ ___-__-__"></div></div>
      </div>`,
      { okMatn:"Qo'shish", ok(){
        const nom = document.getElementById("mij-nom").value.trim();
        if (!nom){ AUGA.toast("Mijoz ismi kiritilmadi — ro'yxat o'zgarmadi", "i-ogoh"); return; }
        const aloqa = document.getElementById("mij-aloqa").value.trim() || "Aloqa kiritilmagan";
        o.mijozlar.push([nom, aloqa, "korik", "Ko'rik so'raldi"]);
        bosqichChiz(); panelChiz();
        AUGA.toast(nom+" potensial mijozlar ro'yxatiga qo'shildi");
      }});
  });

  document.getElementById("sotuv-yakunlash").addEventListener("click", ()=>{
    AUGA.modal("Sotuvni yakunlash — "+o.nom,
      `<div style="display:grid;gap:13px;margin-top:6px">
        <div><label class="maydon-yorliq">Xaridor</label><div class="kirish"><svg class="ic"><use href="#i-foyd"/></svg><input value="${o.mijozlar[0][0]}"></div></div>
        <div><label class="maydon-yorliq">Sotuv summasi</label><div class="kirish"><svg class="ic"><use href="#i-daromad"/></svg><input value="${o.narx}"></div></div>
        <div><label class="maydon-yorliq">Shartnoma raqami</label><div class="kirish"><svg class="ic"><use href="#i-shartnoma"/></svg><input placeholder="SOT-2026-____"></div></div>
        <label class="katakcha"><input type="checkbox" checked><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Oldi-sotdi shartnomasi biriktirildi</label>
        <label class="katakcha"><input type="checkbox" checked><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>To'lov tasdiqnomasi biriktirildi</label>
        <label class="katakcha"><input type="checkbox"><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Topshirish dalolatnomasi biriktirildi</label>
        <div style="background:#FFF6DE;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#8A6116">
          Obyekt sotilgach <b>doimiy arxivga</b> o'tadi va faol reyestrdan chiqariladi. Arxiv yozuvi hech qachon o'chirilmaydi.
        </div>
      </div>`,
      { okMatn:"Sotuvni tasdiqlash", ok(){
        AUGA.toast(o.nom+" sotuvi rasmiylashtirildi — arxiv yozuvi tayyorlanmoqda", "i-belgi-doira");
        setTimeout(()=>location.href="arxiv.html", 1100);
      }});
  });
}
bosqichChiz(); panelChiz();
});
</script>
</body>
</html>
